name: Operations CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-password
          MYSQL_DATABASE: hetun_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      HETUN_TEST_REDIS_ADDR: 127.0.0.1:6379
      HETUN_TEST_MYSQL_DSN: root:isolated-ci-password@tcp(127.0.0.1:3306)/hetun_test?timeout=5s
      HETUN_TEST_MYSQL_PASSWORD: isolated-ci-password
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum
      - name: Install locked dependencies outside source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hetun-ops-dependencies"
          cp package.json package-lock.json "$RUNNER_TEMP/hetun-ops-dependencies/"
          npm ci --prefix "$RUNNER_TEMP/hetun-ops-dependencies" --no-audit --no-fund
      - name: Type check and build operations bundle
        env:
          HETUN_UNI_DEPS: ${{ runner.temp }}/hetun-ops-dependencies/node_modules
          HETUN_OPERATIONS_BUILD_ROOT: ${{ runner.temp }}/hetun-ops-build
        run: node deploy/operations/build.mjs
      - name: Verify installation, CMS and published runtime
        env:
          HETUN_OPERATIONS_BUILD_INFO: ${{ runner.temp }}/hetun-ops-build/latest-build.json
        run: node --test deploy/operations/integration.test.mjs

      - name: Save verified installation bundles
        uses: actions/upload-artifact@v4
        with:
          name: hetun-operations-verified
          path: ${{ runner.temp }}/hetun-ops-build/release/*/*
          if-no-files-found: error
