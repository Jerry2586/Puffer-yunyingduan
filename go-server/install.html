<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>河豚运营中心 · 安装</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e131b;color:#edf1fa;font-family:system-ui,sans-serif}main{max-width:1040px;margin:7vh auto;padding:24px;display:grid;grid-template-columns:.8fr 1.2fr;gap:54px}aside{padding-top:40px}small{color:#a99bf3;letter-spacing:2px}h1{font-size:34px;font-weight:650}p{color:#94a0b5;line-height:1.9;font-size:14px}form{background:#171e2a;border:1px solid #2a3345;border-radius:20px;padding:28px}h2{font-size:20px;margin:0 0 20px}label{display:block;font-size:13px;margin-top:18px}input{width:100%;margin-top:8px;padding:12px;border:1px solid #35415a;border-radius:8px;background:#111823;color:#edf1fa;font:inherit}button{border:1px solid #35415a;background:#252d3d;color:#edf1fa;border-radius:9px;padding:12px 18px;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:1fr 100px;gap:12px}.actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.primary{background:#8b70e8;border-color:#8b70e8}#status{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:0}a{color:#c7b6fa}input:focus,button:focus-visible{outline:2px solid #a99bf3;outline-offset:2px}@media(max-width:720px){main{grid-template-columns:1fr;gap:20px;margin:15px auto}aside{padding:0}h1{font-size:26px}}
</style></head><body><main><aside><small>HETUN OPERATIONS CENTER</small><h1>安装河豚运营中心</h1><p>数据库连接 → 创建管理员 → 进入后台</p><p>填写宝塔刚创建的独立空数据库。程序会自动建立数据表，无需导入 SQL，无需授权码。</p><p>安装完成后可在后台接入苹果 CMS。安装入口会自动关闭，后续直接登录。</p></aside><form id="install"><h2>服务初始化</h2><label>后台完整访问地址<input name="publicOrigin" type="url" placeholder="https://你的运营域名" required></label><div class="grid"><label>数据库地址<input name="host" value="127.0.0.1" required maxlength="253"></label><label>端口<input name="port" type="number" value="3306" min="1" max="65535" required></label></div><label>数据库名<input name="database" required maxlength="64"></label><label>数据库用户名<input name="username" required maxlength="80" autocomplete="off"></label><label>数据库密码<input name="password" type="password" autocomplete="off" maxlength="256"></label><label>管理员账号<input name="admin" required pattern="[A-Za-z0-9_]{3,40}" minlength="3" maxlength="40" autocomplete="username" placeholder="3–40位字母、数字或下划线"></label><label>管理员密码<input name="adminPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="至少12位，包含字母和数字"></label><label>确认管理员密码<input name="confirm" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><div class="actions"><button type="button" id="test">测试数据库连接</button><button type="submit" class="primary">完成安装</button></div><p id="status" role="status" aria-live="polite">安装配置仅保存于你自己的服务器。</p></form></main><script nonce="NONCE_PLACEHOLDER">
const form=document.getElementById('install'),status=document.getElementById('status');form.elements.publicOrigin.value=location.origin;
async function send(action){const values=Object.fromEntries(new FormData(form));if(action==='complete'&&!form.reportValidity())return;if(action==='complete'&&values.adminPassword!==values.confirm){status.textContent='两次管理员密码不一致';return}delete values.confirm;values.port=Number(values.port);for(const b of form.querySelectorAll('button'))b.disabled=true;status.textContent=action==='test'?'正在连接数据库…':'正在建立数据表并保存安装配置…';try{const response=await fetch(location.pathname.replace(/\/$/,'')+'/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Hetun-Install':'1'},body:JSON.stringify(values)});const result=await response.json();if(!response.ok)throw Error(result.error||'操作失败，请查看项目日志');status.textContent=result.message||'安装完成，正在进入登录页…';if(result.redirect)location.replace(result.redirect)}catch(e){status.textContent=e.message}finally{for(const b of form.querySelectorAll('button'))b.disabled=false}}
document.getElementById('test').addEventListener('click',()=>send('test'));form.addEventListener('submit',e=>{e.preventDefault();send('complete')});
</script></body></html>
